<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Snack Hut, Barikot Swat — pizza, burgers, fried chicken, shawarma, fries & drinks. Order online for delivery, take away or dine-in. Open daily 11:00 AM – 2:00 AM."
    />
    <meta name="theme-color" content="#e8622a" />

    <!-- Link preview card. The shop shares menu, deal and coupon links over
         WhatsApp constantly, so these decide what those messages look like.
         The image origin is filled in at build time (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Snack Hut" />
    <meta property="og:title" content="The Snack Hut — Fresh. Fast. Delicious." />
    <meta
      property="og:description"
      content="Pizza, burgers, fried chicken, shawarma & more in Barikot, Swat. Order online for delivery, take away or dine-in. Open daily 11:00 AM – 2:00 AM."
    />
    <meta property="og:image" content="%SITE_URL%/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Snack Hut — Fresh. Fast. Delicious." />
    <meta
      name="twitter:description"
      content="Pizza, burgers, fried chicken, shawarma & more in Barikot, Swat. Order online for delivery, take away or dine-in."
    />
    <meta name="twitter:image" content="%SITE_URL%/logo.png" />

    <!-- Google Fonts is a third origin: warm up the connection (and the CSS
         host separately, since the font files come from gstatic). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>The Snack Hut — Fresh. Fast. Delicious.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply saved theme + accent before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
          }
          var a = localStorage.getItem('accent')
          if (a && a !== 'orange') document.documentElement.setAttribute('data-accent', a)
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
